# =============================================================================
# Review gate — every PR needs a passing staff-reviewer report for its HEAD commit
# =============================================================================
# The staff-reviewer posts its report as a PR comment containing a marker:
#   <!-- staff-reviewer: verdict=APPROVE sha=<full head sha> round=<n> -->
# This workflow publishes the commit status `review-gate` on the PR head:
#   failure  → PR author, a commit author or a commit committer is not the maintainer
#              account, or a commit carries AI attribution trailers
# The maintainer is read from .claude/identity.json on the DEFAULT branch (never from
# the PR, so a PR can't change who it must be authored by). Repository variables
# REVIEW_REPORT_AUTHOR and ALLOWED_PR_AUTHORS override it when set.
#   success  → latest report for this exact SHA is APPROVE or APPROVE_WITH_COMMENTS
#   failure  → latest report for this SHA is REQUEST_CHANGES or BLOCK
#   pending  → no report for this SHA yet (any new push invalidates earlier reports)
# It also keeps exactly one review label on the PR, so its state is visible at a glance:
#   review: approved · review: changes requested · review: pending · review: identity mismatch
# Make `review-gate` a required status check on the base branch. Merging stays a human action.
# =============================================================================

name: Review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write   # review labels
  issues: write          # labels are managed through the issues API
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: review-gate
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          REPORT_AUTHOR: ${{ vars.REVIEW_REPORT_AUTHOR }}
          ALLOWED_AUTHORS: ${{ vars.ALLOWED_PR_AUTHORS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sha = pr.head.sha;

            const setStatus = (state, description, target_url) =>
              github.rest.repos.createCommitStatus({
                owner, repo, sha, state, context: 'review-gate',
                description: description.slice(0, 140), target_url,
              });

            // Review labels: exactly one is present at any time.
            const LABELS = {
              approved:  { name: 'review: approved',          color: '1a7f37', description: 'Staff review approved; awaiting maintainer merge' },
              changes:   { name: 'review: changes requested', color: 'cf222e', description: 'Staff review requested changes; programmer to fix and resubmit' },
              pending:   { name: 'review: pending',           color: 'bf8700', description: 'No staff review for the current head commit yet' },
              identity:  { name: 'review: identity mismatch', color: '8250df', description: 'PR or commits are not under the maintainer account' },
            };
            const setLabel = async (key) => {
              for (const label of Object.values(LABELS)) {
                try { await github.rest.issues.createLabel({ owner, repo, ...label }); } catch (err) { if (err.status !== 422) throw err; }
              }
              const current = new Set((await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: number })).data.map(l => l.name));
              for (const [k, label] of Object.entries(LABELS)) {
                if (k !== key && current.has(label.name)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label.name });
                }
              }
              if (!current.has(LABELS[key].name)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABELS[key].name] });
              }
            };

            // 0. Resolve the maintainer from the default branch's identity file.
            let maintainer = (process.env.REPORT_AUTHOR || '').trim();
            if (!maintainer) {
              try {
                const { data: file } = await github.rest.repos.getContent({
                  owner, repo, path: '.claude/identity.json', ref: context.payload.repository.default_branch,
                });
                maintainer = String(JSON.parse(Buffer.from(file.content, 'base64').toString('utf8')).github_login || '').trim();
              } catch (err) {
                core.warning(`Could not read .claude/identity.json from the default branch: ${err.message}`);
              }
            }
            if (!maintainer) {
              await setStatus('failure', 'No maintainer identity: add .claude/identity.json to the default branch or set REVIEW_REPORT_AUTHOR', pr.html_url);
              return;
            }
            process.env.REPORT_AUTHOR = maintainer;

            // 1. Identity: the PR and every commit must appear on GitHub as the maintainer.
            const allowed = (process.env.ALLOWED_AUTHORS || maintainer).split(',').map(s => s.trim()).filter(Boolean);
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: number, per_page: 100,
            });
            const trailer = /^(co-authored-by:.*(claude|anthropic)|claude-session:|.*generated with \[?claude code)/im;
            const problems = [];
            if (!allowed.includes(pr.user.login)) problems.push(`PR author is ${pr.user.login}`);
            for (const c of commits) {
              const short = c.sha.slice(0, 7);
              const author = c.author?.login ?? `unlinked <${c.commit.author.email}>`;
              const committer = c.committer?.login ?? `unlinked <${c.commit.committer.email}>`;
              if (!allowed.includes(author)) problems.push(`${short} author ${author}`);
              if (!allowed.includes(committer) && committer !== 'web-flow') problems.push(`${short} committer ${committer}`);
              if (trailer.test(c.commit.message)) problems.push(`${short} has AI attribution trailer`);
            }
            if (problems.length) {
              core.warning(problems.join('; '));
              await setStatus('failure', `Identity check failed: ${problems.join('; ')}`, pr.html_url);
              await setLabel('identity');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const marker = /<!--\s*staff-reviewer:\s*verdict=([A-Z_]+)\s+sha=([0-9a-f]{40})\s+round=(\d+)\s*-->/;

            let latest = null;
            for (const c of comments) {
              if (c.user?.login !== process.env.REPORT_AUTHOR) continue;
              const m = (c.body || '').match(marker);
              if (m && m[2] === sha) latest = { verdict: m[1], round: m[3], url: c.html_url };
            }

            const passing = ['APPROVE', 'APPROVE_WITH_COMMENTS'];
            let state, description, target_url;
            if (!latest) {
              state = 'pending';
              description = `No staff-reviewer report for ${sha.slice(0, 7)} yet`;
            } else if (passing.includes(latest.verdict)) {
              state = 'success';
              description = `${latest.verdict} (round ${latest.round}) — handed to maintainer for final review and merge`;
              target_url = latest.url;
            } else {
              state = 'failure';
              description = `${latest.verdict} (round ${latest.round}) — handed to programmer to fix and resubmit`;
              target_url = latest.url;
            }

            await setStatus(state, description, target_url);
            await setLabel(state === 'success' ? 'approved' : state === 'failure' ? 'changes' : 'pending');
            core.info(`review-gate: ${state} — ${description}`);
