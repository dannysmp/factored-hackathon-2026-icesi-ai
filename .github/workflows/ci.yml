# =============================================================================
# Continuous integration
# =============================================================================
# Purpose:
#   Verify every pull request and every push to main with the same make targets that
#   developers run locally, so a green run means the same thing on any machine.
#
# Jobs:
#   lint         Formatting, linting, strict type-checking and the dependency audit.
#   test         Hermetic tests with the coverage gate, and the policy-corpus drift check
#                (runs after lint).
#   secret-scan  Full-history secret scan and the scanner self-test.
#   gate-scripts Executed fixture test of the review gate's glob translation
#                (.github/scripts/glob-match.js), independent of the other jobs.
#   web          The web/ package's own lint, test (with its coverage gate) and build,
#                independent of the Python jobs.
#
# Security posture:
#   The workflow token is read-only and no cloud credentials are configured. Third-party
#   actions are pinned to full commit SHAs, and the gitleaks release is pinned by version and
#   verified against its published checksum before it is installed.
#
# Pinned actions:
#   actions/checkout       11d5960a326750d5838078e36cf38b85af677262   release v4
#   astral-sh/setup-uv     d0d8abe699bfb85fec6de9f7adb5ae17292296ff   release v6
#   actions/setup-node     820762786026740c76f36085b0efc47a31fe5020   release v7.0.0
#
# Usage:
#   Runs automatically. To reproduce locally: make lint test audit secrets
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Check formatting, lint rules and types
        run: make lint
      - name: Audit dependencies for known vulnerabilities
        run: make audit

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Run unit and contract tests with the coverage gate
        run: make test
      - name: Check the policy corpus is what the policy generates
        run: make corpus-check

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history so earlier commits are scanned too
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install the pinned gitleaks release after verifying its checksum
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and staged changes, then prove the scanner blocks a planted key
        run: make secrets

  # ---------------------------------------------------------------------------
  # Review gate helper scripts
  # ---------------------------------------------------------------------------
  gate-scripts:
    name: gate-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install a pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Run the glob translation's fixture test
        run: node .github/scripts/glob-match.test.js

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install a pinned Node.js with npm dependency caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint && npm run format
      - name: Type-check and build
        run: npm run build
      - name: Run tests with the coverage gate
        run: npm run test
