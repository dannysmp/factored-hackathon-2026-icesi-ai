# =============================================================================
# CI — lint, tests, dependency audit and secret scan on every PR and on main
# =============================================================================
# Purpose:  Gate every change with the same make targets developers run locally.
# Design Principles:
#   - Least privilege: read-only token, no cloud credentials of any kind.
#   - Third-party actions pinned to commit SHAs; gitleaks pinned by version + checksum.
#   - Later epics add jobs (smoke eval slice, image build) to this file.
# Usage:    Runs automatically; locally: make lint test audit secrets
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # ---- Static checks ---------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Format, lint and type-check
        run: make lint
      - name: Dependency vulnerability audit
        run: make audit

  # ---- Tests -----------------------------------------------------------------
  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Unit and contract tests with coverage gate
        run: make test

  # ---- Secret scanning -------------------------------------------------------
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history so committed-then-removed secrets are found
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and tree, then prove the scanner blocks a planted key
        run: make secrets
