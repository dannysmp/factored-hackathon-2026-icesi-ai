# =============================================================================
# Continuous integration
# =============================================================================
# Purpose:
#   Verify every pull request and every push to main with the same make targets that
#   developers run locally, so a green run means the same thing on any machine.
#
# Jobs:
#   lint         Formatting, linting, strict type-checking and the dependency audit.
#   test         Hermetic tests with the coverage gate, and the policy-corpus drift check
#                (runs after lint).
#   secret-scan  Full-history secret scan and the scanner self-test.
#   gate-scripts Executed fixture test of the review gate's glob translation
#                (.github/scripts/glob-match.js), independent of the other jobs.
#   web          The web/ package's own lint, test (with its coverage gate) and build,
#                independent of the Python jobs.
#   test-postgres Migrations applied to a fresh service-container Postgres, then the tests
#                marked integration run against it.
#   smoke        The evaluation harness's 16-case injection-and-authorization slice, run
#                against P and B0 over a fresh service-container Postgres seeded with wholly
#                synthetic data (never the provider's real data); blocks merge on any case
#                turning unsafe. B1 does not run here — its whole purpose is measuring a real,
#                unsupervised LLM, so a stubbed run of it would be a no-op, not a smoke test.
#   docker-build-check  Builds the backend image for real and imports, from inside a running
#                container, every top-level directory the app reads from disk at serving time
#                (personas/, prompts/) — the other jobs here all run against the checkout
#                directly, so none of them would ever catch a file the Dockerfile or
#                .dockerignore forgot to carry into the image itself.
#   semgrep      Static analysis (security-audit, OWASP Top 10, secrets rule packs), blocking
#                on ERROR-severity findings only.
#
# Security posture:
#   The workflow token is read-only and no cloud credentials are configured. Third-party
#   actions are pinned to full commit SHAs, and the gitleaks release is pinned by version and
#   verified against its published checksum before it is installed. Semgrep runs a curated set
#   of rule packs pinned to a fixed Semgrep version (make semgrep, SEMGREP_VERSION in the
#   Makefile) rather than the full community "auto" registry: this codebase uses raw psycopg
#   and duckdb, never SQLAlchemy, and the broader registry's SQLAlchemy-specific and generic
#   formatted-SQL rules produce 59 false positives against this project's own established
#   escaping convention (quote_literal/quote_identifier for DuckDB DDL, parameterized queries
#   for psycopg) — verified case by case before choosing the curated packs.
#
# Pinned actions:
#   actions/checkout       11d5960a326750d5838078e36cf38b85af677262   release v4
#   astral-sh/setup-uv     d0d8abe699bfb85fec6de9f7adb5ae17292296ff   release v6
#   actions/setup-node     820762786026740c76f36085b0efc47a31fe5020   release v7.0.0
#
# Usage:
#   Runs automatically. To reproduce locally: make lint test audit secrets semgrep
#   For test-postgres: make db-up migrate test-integration (needs docker and DATABASE_URL set)
#   For smoke: make db-up migrate seed-ci-smoke, then
#     LLM_PROVIDER=stub make evaluate SYSTEM=P SMOKE=1 && LLM_PROVIDER=stub make evaluate SYSTEM=B0 SMOKE=1
#   For docker-build-check: docker build -t dispute-intake-backend:ci -f Dockerfile . && docker
#     run --rm dispute-intake-backend:ci python -c "from app.security.demo_personas import
#     load_personas; from app.llm.prompts import load_prompt; load_personas();
#     [load_prompt(n) for n in ('nlu_v1', 'render_v1', 'judge_v1')]"
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Check formatting, lint rules and types
        run: make lint
      - name: Audit dependencies for known vulnerabilities
        run: make audit

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Run unit and contract tests with the coverage gate
        run: make test
      - name: Check the policy corpus is what the policy generates
        run: make corpus-check

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history so earlier commits are scanned too
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install the pinned gitleaks release after verifying its checksum
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and staged changes, then prove the scanner blocks a planted key
        run: make secrets

  # ---------------------------------------------------------------------------
  # Review gate helper scripts
  # ---------------------------------------------------------------------------
  gate-scripts:
    name: gate-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install a pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Run the glob translation's fixture test
        run: node .github/scripts/glob-match.test.js

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install a pinned Node.js with npm dependency caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint && npm run format
      - name: Type-check and build
        run: npm run build
      - name: Run tests with the coverage gate
        run: npm run test

  # ---------------------------------------------------------------------------
  # Postgres integration tests
  # ---------------------------------------------------------------------------
  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispute_intake
          POSTGRES_PASSWORD: dispute_intake
          POSTGRES_DB: dispute_intake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispute_intake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dispute_intake:dispute_intake@localhost:5432/dispute_intake
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Apply pending migrations to the service container
        run: make migrate
      - name: Run the tests that need a real Postgres
        run: make test-integration

  # ---------------------------------------------------------------------------
  # Evaluation smoke slice
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispute_intake
          POSTGRES_PASSWORD: dispute_intake
          POSTGRES_DB: dispute_intake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispute_intake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dispute_intake:dispute_intake@localhost:5432/dispute_intake
      # A fixed, non-secret value: this job never calls a real LLM (LLM_PROVIDER=stub below) or
      # touches real customer data, so nothing here needs to be a protected secret.
      SESSION_SIGNING_KEY: ci-smoke-session-signing-key-with-enough-distinct-characters-0
      TEST_IDENTITY_ENABLED: "true"
      TEST_IDENTITY_KEY: ci-smoke-sandbox-login-key-0123456789
      SERVICE_VERSION: ${{ github.sha }}
      DATA_AS_OF_DATE: "2026-06-18"
      LLM_PROVIDER: stub
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Apply pending migrations to the service container
        run: make migrate
      - name: Seed the CI-only synthetic data the smoke slice needs
        run: make seed-ci-smoke
      - name: Run the smoke slice against P
        run: make evaluate SYSTEM=P SMOKE=1
      - name: Run the smoke slice against B0
        run: make evaluate SYSTEM=B0 SMOKE=1

  # ---------------------------------------------------------------------------
  # Backend image
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: docker-build-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the backend image
        run: docker build -t dispute-intake-backend:ci -f Dockerfile .
      - name: Confirm every runtime-read directory actually reached the image
        # Catches the class of bug the Dockerfile/.dockerignore's own allow-list already missed
        # twice (personas/, then prompts/): a file the app reads from disk at serving time,
        # never exercised by the other jobs here since they all run against the source tree
        # directly, not this image. Import from inside a real container, not the checkout.
        run: |
          docker run --rm dispute-intake-backend:ci python -c "
          from app.security.demo_personas import load_personas
          from app.llm.prompts import load_prompt
          load_personas()
          for name in ('nlu_v1', 'render_v1', 'judge_v1'):
              load_prompt(name)
          print('every runtime-read file loaded from inside the built image')
          "

  # ---------------------------------------------------------------------------
  # Static analysis
  # ---------------------------------------------------------------------------
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Run static analysis, blocking on ERROR-severity findings
        run: make semgrep
