# =============================================================================
# Dependency update automation
# =============================================================================
# Dependabot checks the Python dependencies (pinned by uv.lock) and the GitHub Actions used
# by the workflows once a month and opens pull requests for available updates.
# =============================================================================

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
