# =============================================================================
# docker-compose.prod.yml — the deployed stack, on top of the base compose
# =============================================================================
# Purpose:
#   Adds the backend, the web build and Caddy to the base Postgres service
#   (docker-compose.yml), rather than duplicating it (ADR-13: one compose
#   file, local/prod parity). Metabase is a later slice's own service.
# Design:
#   Every image reference and every secret is an environment variable, never
#   a literal in this file: `ECR_REGISTRY` (the account-specific registry
#   host), `IMAGE_TAG`, `ANTHROPIC_API_KEY` and `SESSION_SIGNING_KEY` (read
#   from SSM Parameter Store by the deploy step, never written to disk here)
#   and `HOST_NAME` (the sslip.io address, or a real domain later).
#   `DATA_AS_OF_DATE` defaults to the evaluation period's own reference date
#   (ADR-15): the deployed database starts empty, with no `ops_meta` seed row
#   for the domain calendar to fall back on, and the service refuses to start
#   rather than guess the real date. An explicit ISO date still wins over
#   this default (ADR-15's own resolution order), so a run against a seeded
#   database can still override it.
#   The demo sign-in variables (ADR-18) all default empty/false: a smoke
#   deployment that never created the access codes in SSM gets a backend with
#   sign-in disabled, exactly as before this pass added them. The deploy
#   step (05-deploy.sh) derives `DEMO_SIGNIN_ENABLED`/`DEMO_AGENT_SIGNIN_ENABLED`
#   from whether the corresponding SSM parameters exist, not from a separate
#   toggle — creating the access codes is what turns sign-in on.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (the deploy pipeline, a later slice, sets the environment variables above
#   and runs this on the host; not run directly from a developer machine)
# =============================================================================

services:
  backend:
    image: ${ECR_REGISTRY}/dispute-intake-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      SERVICE_VERSION: ${IMAGE_TAG:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dispute_intake}:${POSTGRES_PASSWORD:-dispute_intake}@postgres:5432/${POSTGRES_DB:-dispute_intake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
      DATA_AS_OF_DATE: ${DATA_AS_OF_DATE:-2026-06-18}
      DEMO_SIGNIN_ENABLED: ${DEMO_SIGNIN_ENABLED:-false}
      DEMO_SIGNIN_ACCESS_CODE: ${DEMO_SIGNIN_ACCESS_CODE:-}
      DEMO_AGENT_SIGNIN_ENABLED: ${DEMO_AGENT_SIGNIN_ENABLED:-false}
      DEMO_AGENT_ACCESS_CODE: ${DEMO_AGENT_ACCESS_CODE:-}
      AGENT_SESSION_SIGNING_KEY: ${AGENT_SESSION_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${ECR_REGISTRY}/dispute-intake-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOST_NAME: ${HOST_NAME}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - web

volumes:
  caddy-data:
  caddy-config:
