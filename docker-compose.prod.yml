# =============================================================================
# docker-compose.prod.yml — the deployed stack, on top of the base compose
# =============================================================================
# Purpose:
#   Adds the backend, the web build and Caddy to the base Postgres service
#   (docker-compose.yml), rather than duplicating it (one compose
#   file, local/prod parity). Metabase is a separate, optional service.
# Design:
#   Every image reference and every secret is an environment variable, never
#   a literal in this file: `ECR_REGISTRY` (the account-specific registry
#   host), `IMAGE_TAG`, `ANTHROPIC_API_KEY`, `SESSION_SIGNING_KEY` and
#   `POSTGRES_PASSWORD` (read from SSM Parameter Store by the deploy step,
#   never written to disk here) and `HOST_NAME` (the sslip.io address, or a
#   real domain later).
#   `POSTGRES_PASSWORD` has no `:-` default here, deliberately:
#   the base compose file's own `POSTGRES_PASSWORD:-dispute_intake` default
#   exists only so plain local development works with nothing SSM-backed
#   exported; a deployed stack must never silently fall through to that
#   value, so this file requires the real one to already be in the
#   environment, exactly like the two secrets above it — `05-deploy.sh`
#   fails before ever running `docker compose up` if the SSM parameter
#   doesn't exist, rather than deploying with a hardcoded default password.
#   `DATA_AS_OF_DATE` defaults to the evaluation period's own reference date: the
#   deployed database starts empty, with no `ops_meta` seed row for the domain
#   calendar to fall back on, and the service refuses to start rather than guess
#   the real date. An explicit ISO date still wins over this default, so a run
#   against a seeded database can still override it.
#   The demo sign-in variables all default empty/false: a smoke deployment that
#   never created the access codes in SSM gets a backend with sign-in disabled, exactly as if sign-in were not configured. The deploy
#   step (05-deploy.sh) derives `DEMO_SIGNIN_ENABLED`/`DEMO_AGENT_SIGNIN_ENABLED`
#   from whether the corresponding SSM parameters exist, not from a separate
#   toggle — creating the access codes is what turns sign-in on.
#   `backend`'s seed mount is read-only and matches `app.persistence.load_seed`'s
#   own default `--gold` path exactly (`data/gold/ops_seed`, resolved against
#   the image's `/app` working directory), so the deploy step's one-off
#   `docker compose run` invocations need no extra flag to find it. The
#   directory is populated by the deploy step itself, from this project's own
#   seed bucket (11-create-seed-bucket.sh), never baked into the image. The
#   dispute-demand marts mount the same way, at `pipelines.analytics_load`'s own
#   default `--gold` path (`data/gold/dispute_demand`).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (the deploy pipeline sets the environment variables above
#   and runs this on the host; not run directly from a developer machine)
# =============================================================================

services:
  backend:
    image: ${ECR_REGISTRY}/dispute-intake-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      SERVICE_VERSION: ${IMAGE_TAG:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dispute_intake}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispute_intake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
      DATA_AS_OF_DATE: ${DATA_AS_OF_DATE:-2026-06-18}
      DIALOGUE_MAX_TURNS: ${DIALOGUE_MAX_TURNS:-30}
      DEMO_SIGNIN_ENABLED: ${DEMO_SIGNIN_ENABLED:-false}
      DEMO_SIGNIN_ACCESS_CODE: ${DEMO_SIGNIN_ACCESS_CODE:-}
      DEMO_AGENT_SIGNIN_ENABLED: ${DEMO_AGENT_SIGNIN_ENABLED:-false}
      DEMO_AGENT_ACCESS_CODE: ${DEMO_AGENT_ACCESS_CODE:-}
      AGENT_SESSION_SIGNING_KEY: ${AGENT_SESSION_SIGNING_KEY:-}
      LLM_DAILY_SPEND_LIMIT_USD: ${LLM_DAILY_SPEND_LIMIT_USD:-10}
    volumes:
      - ./seed/ops_seed:/app/data/gold/ops_seed:ro
      - ./seed/dispute_demand:/app/data/gold/dispute_demand:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${ECR_REGISTRY}/dispute-intake-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOST_NAME: ${HOST_NAME}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - web

volumes:
  caddy-data:
  caddy-config:
