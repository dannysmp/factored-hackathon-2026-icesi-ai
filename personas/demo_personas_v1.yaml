# Demo sign-in personas (ADR-18): the closed set of slugs the demo broker accepts. A slug is
# never a customer identifier or a document number — the customer_id it maps to never appears on
# the wire.
#
# PLACEHOLDER DATA: the customer_id values below are structurally valid but do not name real
# seeded customers. The six-script/two-to-three-agent composition (Spanish, Portuguese, English,
# human-required, repeat complainer) is approved, but the exact seeded customer identifiers were
# carried to the maintainer separately and are not recorded anywhere this file's author could
# read. Startup validation (app.security.demo_personas) fails closed, naming the slug, when a
# customer_id here does not resolve to an Active seeded customer — so shipping placeholders is
# safe: DEMO_SIGNIN_ENABLED simply cannot start until the real identifiers replace these. Replace
# every customer_id below with a real Active customer before enabling DEMO_SIGNIN_ENABLED in any
# environment.
