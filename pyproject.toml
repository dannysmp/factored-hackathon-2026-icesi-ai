# =============================================================================
# pyproject.toml — project manifest, dependency groups and tool configuration
# =============================================================================
# Purpose:
#   Single source for the Python runtime version, dependencies and the settings
#   of ruff, mypy, pytest and coverage. Versions are pinned by uv.lock.
#
# Design Principles:
#   - One runtime (Python 3.11) used identically by local tooling and CI.
#   - Runtime and development dependencies are separate groups.
#   - Every dependency states its role; add one only with a reason in the PR.
#
# Usage:
#   make setup     # uv sync --frozen
#   make lint test # the same targets CI runs
# =============================================================================

[project]
name = "dispute-intake"
version = "0.1.0"
description = "AI-first transaction-dispute intake system for a LATAM retail bank"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115,<1",  # Web framework for the service API
    "uvicorn[standard]>=0.30,<1",  # ASGI server that runs the FastAPI app
    "pydantic>=2.8,<3",  # Validated contracts at every boundary
    "pydantic-settings>=2.4,<3",  # Typed, fail-fast configuration from the environment
    "pyjwt>=2.8,<3",  # Signs and verifies the short-lived session tokens
    "pyyaml>=6,<7",  # Loads the versioned dispute-policy files
    "anthropic>=0.69,<1",  # Client for the language model API behind the LLM port
    "psycopg[binary]>=3.2,<4",  # Serving-store driver: vanilla SQL over a DSN, no ORM
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",  # Test runner
    "pytest-cov>=5,<7",  # Coverage measurement and gate
    "hypothesis>=6.100,<7",  # Property-based tests
    "httpx>=0.27,<1",  # Client used by FastAPI's in-process TestClient
    "ruff>=0.6,<1",  # Formatter and linter
    "mypy>=1.11,<2",  # Strict static typing
    "pip-audit>=2.7,<3",  # Dependency vulnerability scan
    "types-pyyaml>=6,<7",  # Type stubs for the YAML loader under strict mypy
]
data = [
    "duckdb>=1.1,<2",  # Columnar SQL engine for profiling and pipelines over CSV/Parquet
]
ml = [
    "numpy>=2.1,<3",  # Arrays for the model matrices and the customer bootstrap
    "scikit-learn>=1.5,<2",  # Logistic regression, gradient boosting and precision-recall metrics
]

[tool.uv]
# Data and model tooling ship with the default environment so `make setup` covers the pipelines
# and the risk model too. The `ml` group stays out of the runtime image (ADR-6): risk scores are
# computed in batch, offline, so the deployed service never imports it.
default-groups = ["dev", "data", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Security (S), blind excepts (BLE), print (T20) and simplifications are enforced on purpose.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE", "RET", "PL", "RUF", "T20"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# The data stages interpolate only quoted identifiers from the static table registry (and
# constants from the contracts) into SQL and never a value read from the data, so the
# string-built-query rule does not apply to them.
"pipelines/profile.py" = ["S608"]
"pipelines/raw.py" = ["S608"]
"pipelines/gold.py" = ["S608"]
"pipelines/risk_features.py" = ["S608"]
"pipelines/silver.py" = ["S608"]
"pipelines/ops_seed.py" = ["S608"]
# Table and column names here come only from the fixed seed-output registry and the Parquet
# files' own headers (written by pipelines.ops_seed, reviewed there), never from a request.
"app/persistence/load_seed.py" = ["S608"]
# Same reason: the shared amount expressions are static, reviewed SQL text, not built from input.
"tests/test_amounts.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "contracts", "models", "pipelines", "tests"]

[[tool.mypy.overrides]]
# scikit-learn ships no type stubs and no py.typed marker.
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real local dependencies (containers, running service)",
    "eval: model-backed quality evaluation over a labeled dataset",
    "smoke: runs against a deployed environment",
]

[tool.coverage.run]
branch = true
source = ["app", "contracts", "models", "pipelines"]

[tool.coverage.report]
# Combined line+branch floor; the standard asks for >=85% lines and >=80% branches.
fail_under = 85
show_missing = true
