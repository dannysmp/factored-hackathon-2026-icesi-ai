# =============================================================================
# docker-compose.metabase.yml — the BI dashboard, on top of the deployed stack
# =============================================================================
# Purpose:
#   Metabase (ADR-11): reads the `analytics` schema the mart-load job
#   populates (docker-compose.prod.yml's own Postgres service), keeping its
#   own application data in a separate database and role, never the default
#   embedded H2.
# Design:
#   A third, additive compose file, never merged into docker-compose.prod.yml:
#   `infra/scripts/08-deploy-metabase.sh` creates this service's database and
#   role before starting it, and completes its first-run setup before Caddy
#   is given a config that can reach it (ADR-11's own hardening) — bringing
#   it up as part of the same `up -d` docker-compose.prod.yml uses would skip
#   both steps. `MB_DB_*` name its own database; `MB_DB_PASS` and the heap
#   cap are environment variables the deploy step sets, never literals here.
#   The published port is bound to loopback only: nothing outside the host
#   can reach Metabase directly by port, only through Caddy once routed.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.metabase.yml up -d --no-deps metabase
#   (infra/scripts/08-deploy-metabase.sh runs this on the host; not run
#   directly from a developer machine)
# =============================================================================

services:
  metabase:
    image: metabase/metabase:v0.63.18
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${MB_DB_PASS}
      # Signs session tokens against forgery by anyone with database access; unset, Metabase
      # itself warns that sessions are then forgeable from the application database alone.
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY}
      # A JVM heap cap on a shared host (ADR-11: "Metabase runs with a heap cap, and the memory
      # footprint of the five services on the host is measured and recorded").
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
